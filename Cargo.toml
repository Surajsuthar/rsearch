[package]
name = "rsearch"
version = "0.1.0"
edition = "2021"

[lib]
name = "rsearch"
path = "src/lib.rs"

[[bin]]
name = "rsearch"
path = "src/main.rs"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
